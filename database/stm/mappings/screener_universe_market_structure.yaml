    analyst_count:
      transformation_rule: Computed inline from the five recommendation counts, with COALESCE(count, 0)
        on each so a missing count contributes zero to the total, and a CASE guarding division by a zero
        total.
      business_rule: analyst_count is the sum of the five buckets; analyst_buy_pct is the buy and strong-buy
        share of it; analyst_consensus_score is (SB*2 + B - S - SS*2) / total, bounded -2 to +2.
      grain: one row per asx_code
      unit: count; fraction 0-1 for buy_pct; score -2 to +2 for consensus
      applicability: 'COALESCE(count, 0) makes a company with NO analyst coverage indistinguishable from
        one whose five counts are genuinely zero: both give analyst_count = 0. The CASE on the total means
        the derived ratios are NULL rather than zero in that case, which IS the honest answer -- read
        analyst_buy_pct, not analyst_count, to tell coverage from consensus.'
      derivation_formula: NULLIF( COALESCE(ar.strong_buy,0) + COALESCE(ar.buy,0) + COALESCE(ar.hold,0)
        + COALESCE(ar.sell,0) + COALESCE(ar.strong_sell,0), 0 )::SMALLINT AS analyst_count
      source_table: market.analyst_ratings
      source_column: market.analyst_ratings.strong_buy; market.analyst_ratings.buy; market.analyst_ratings.hold;
        market.analyst_ratings.sell; market.analyst_ratings.strong_sell
      tables_involved: market.analyst_ratings
      join_condition: LEFT JOIN market.analyst_ratings AS ar ON ar.asx_code = c.asx_code
      writer_job: build_screener_universe.py (INSERT)
    analyst_buy_pct:
      transformation_rule: Computed inline from the five recommendation counts, with COALESCE(count, 0)
