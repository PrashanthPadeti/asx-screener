      transformation_rule: Six disjoint half-open bands over vs.market_cap in raw AUD -- mega >= 50e9,
        large [10e9, 50e9), mid [2e9, 10e9), small [300e6, 2e9), micro [50e6, 300e6), nano (0, 50e6).
        market_cap_tier is the same cut as a label.
      business_rule: Carried from staging_au.fundamentals. This column is not a metric -- it is the INPUT
        to applicability gate 1b, which marks eight valuation ratios NOT_MEANINGFUL with cause unit_mismatch
        when it is set and is not AUD.
      grain: one row per asx_code
      unit: booleans; market_cap_tier is one of mega/large/mid/small/micro/nano or NULL
      applicability: NULL means the currency is unknown, and the gate does not fire on unknown -- so a
        company whose currency never arrived has its ratios published as if they were AUD-on-AUD. The
        gate is written to fire only on a KNOWN non-AUD currency.
      derivation_formula: fx.reporting_currency
      source_table: staging_au.fundamentals
      source_column: staging_au.fundamentals.reporting_currency
      tables_involved: staging_au.fundamentals
      join_condition: 'LEFT JOIN LATERAL (staging_au.fundamentals) AS fx: WHERE equality on asx_code (a
        unique key) LIMIT 1 -> the determined row; WHERE asx_code = c.asx_code LIMIT 1'
      writer_job: build_screener_universe.py (INSERT)
