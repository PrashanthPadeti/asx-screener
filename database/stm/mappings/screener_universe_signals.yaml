      source_table: market.yearly_metrics
      source_column: market.yearly_metrics.avg_gross_margin_3y; market.yearly_metrics.avg_gross_margin_5y
      tables_involved: market.yearly_metrics
      join_condition: 'LEFT JOIN LATERAL (market.yearly_metrics) AS ym: ORDER BY fiscal_year DESC LIMIT
        1 -> the named row; WHERE asx_code = c.asx_code ORDER BY fiscal_year DESC LIMIT 1'
      writer_job: build_screener_universe.py (INSERT); universe_writer.py (canonical UPDATE, governed)
