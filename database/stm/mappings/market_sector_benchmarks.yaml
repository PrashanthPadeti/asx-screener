# market.sector_benchmarks  (Gold)
#
# GICS sector statistics - median, P25, P75 - rebuilt weekly from the
# served universe. One row per sector, 32 columns.
#
# Authored 9 November 2026 from:
#   backend/compute/engine/sector_benchmarks.py   (the ONLY writer)
#
# Source: screener.universe. Like the market_snapshot family, this is a
# GOLD table fed from UNIVERSE, so every value it aggregates has already
# been through the universe build's own coalescing and fallbacks.
#
# Grain: one row per gics_sector. Load: upsert on gics_sector.
#
# -- It distinguishes governed from ungoverned, and says which ----------
# The engine splits its metrics in two and labels them in the source:
# "Governed" benchmarks carry a state in benchmark_states, with the
# denominator behind every published value; "Ungoverned" ones -
# return_1y_median, return_ytd_median, market_cap_median - are plain
# medians with no state.
#
# A withheld governed benchmark is NULL *with an entry* saying why. A NULL
# ungoverned one says nothing. The two look identical in the column and are
# only distinguishable through benchmark_states.
#
# -- compute_run_id is DECLARED AND NEVER WRITTEN -----------------------
# The column carries a foreign key to screener.compute_runs and this
# comment in the schema:
#
#   "The run that produced this benchmark. Must match the compute_run_id
#    of the screener.universe rows it contextualises: a factor score and
#    the peer statistic shown beside it have to come from the same
#    assessment set and the same model version."
#
# sector_benchmarks.py never mentions compute_run_id. It is absent from the
# INSERT and from the DO UPDATE SET, and no other module writes this table.
# The contract is stated in the schema and enforced nowhere - so a benchmark
# and the universe rows it contextualises cannot be shown to come from the
# same run, which is exactly what the comment requires.

table: market.sector_benchmarks
layer: Gold
source_layer: Universe

defaults:
  source_system: internal
  source_table: screener.universe
  writer_job: compute/engine/sector_benchmarks.py
  load_strategy: upsert (INSERT ... ON CONFLICT DO UPDATE)
  grain: gics_sector
  tables_involved: screener.universe
  join_condition: none - grouped within one table

columns:

  market.sector_benchmarks:

    gics_sector:
      source_column: "sector"
      transformation_rule: "GROUP BY key"
      business_rule: >
        The sector as the universe carries it. A company with no
        sector contributes to no row, so the sum of stock_count across
        sectors is less than the universe.
      unit: "n/a"
      is_key: "yes"
      status: "written"

    stock_count:
      source_column: "(row count)"
      derivation_formula: "count of universe rows in the sector"
      transformation_rule: "peers in the sector"
      business_rule: >
        THE GROUP SIZE, not the denominator of any individual
        benchmark. Each governed metric has its own n_applicable_peers
        and n_valid_peers in benchmark_states, and those are smaller.
      unit: "count"
      status: "written"

    pe_ratio_p25:
      source_column: "pe_ratio"
      derivation_formula: "25th percentile of pe_ratio across the sector's peers"
      transformation_rule: "governed 25th percentile"
      business_rule: >
        GOVERNED: NULL here carries an entry in benchmark_states
        giving the reason and the peer counts. A NULL without an entry
        predates that contract.
      unit: "ratio"
      status: "written"

    pe_ratio_median:
      source_column: "pe_ratio"
      derivation_formula: "median of pe_ratio across the sector's peers"
      transformation_rule: "governed median"
      business_rule: >
        GOVERNED: NULL here carries an entry in benchmark_states
        giving the reason and the peer counts. A NULL without an entry
        predates that contract.
      unit: "ratio"
      status: "written"

    pe_ratio_p75:
