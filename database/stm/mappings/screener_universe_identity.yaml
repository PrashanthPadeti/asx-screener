    isin:
      transformation_rule: Six disjoint half-open bands over vs.market_cap in raw AUD -- mega >= 50e9,
        large [10e9, 50e9), mid [2e9, 10e9), small [300e6, 2e9), micro [50e6, 300e6), nano (0, 50e6).
        market_cap_tier is the same cut as a label.
      business_rule: Bands are on market capitalisation in AUD, taken from market.valuation_snapshot and
        NOT rescaled. The `_bn` columns on the snapshot aggregates are a different quantity and carry
        finding 4 -- do not reconcile these bands against them.
      grain: one row per asx_code
      unit: booleans; market_cap_tier is one of mega/large/mid/small/micro/nano or NULL
      applicability: 'FINDING 12. The six flags are COALESCE(..., FALSE) on columns declared NOT NULL
        DEFAULT false, so an unknown market cap is written as a measured false on all six, while market_cap_tier
        beside them returns NULL. Measured 10 Nov 2026: 641 of 2,566 rows (25.0%) carry six falses and
        a NULL tier. All three consumers test `= TRUE`, so no company is reported in a tier it is not
        in -- instead a quarter of the universe is invisible to every tier filter and nothing says so.
        Read market_cap_tier, which carries the distinction; never write `NOT is_mega`.'
      derivation_formula: c.isin
      source_table: market.companies_current
      source_column: market.companies_current.isin
      tables_involved: market.companies_current
      join_condition: FROM market.companies_current AS c ON
      writer_job: build_screener_universe.py (INSERT)
