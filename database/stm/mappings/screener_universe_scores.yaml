    metric_states:
      source_table: screener.universe, market.daily_metrics
      transformation_rule: The canonical applicability sidecar, emitted by the canonical writer in the
        same statement as the governed values. The builder sets it to NULL explicitly and atomically with
        its own write.
      business_rule: 'Sparse by contract: an ABSENT entry means the metric is applicable. A present entry
        carries {state, cause, reason}. The builder may REVOKE a canonical claim but may never make one,
        because it has assessed nothing -- writing this sidecar there would be claiming an attribution
        it did not compute.'
