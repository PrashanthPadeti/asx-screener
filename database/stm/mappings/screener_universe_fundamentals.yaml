    revenue_fy0:
      transformation_rule: Carried from the annual profit-and-loss statement for the latest fiscal year
        and the pinned prior one.
      business_rule: 'As-reported annual figures. Period: the latest fiscal year the company has reported
        (`pnl0`, chosen by ORDER BY fiscal_year DESC LIMIT 1), NOT a fixed calendar year. Two companies
        in the same row of a screen may be reporting periods up to eleven months apart, and the period
        itself is not published on the row.'
      grain: one row per asx_code per fiscal year
      unit: AUD millions
      applicability: The prior-year lateral pins `fiscal_year = <base>.fiscal_year - N` by name rather
        than taking OFFSET N. OFFSET returned the previous ROW, so a company missing a year had its 'prior
        year' taken from two or more years back and the comparison spanned an interval nobody declared.
