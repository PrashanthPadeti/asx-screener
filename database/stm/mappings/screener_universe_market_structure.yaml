        the derived ratios are NULL rather than zero in that case, which IS the honest answer -- read
        analyst_buy_pct, not analyst_count, to tell coverage from consensus.'
      derivation_formula: CASE WHEN (COALESCE(ar.strong_buy,0) + COALESCE(ar.buy,0) + COALESCE(ar.hold,0)
        + COALESCE(ar.sell,0) + COALESCE(ar.strong_sell,0)) > 0 THEN ROUND( (COALESCE(ar.strong_buy,0)*2
        + COALESCE(ar.buy,0) - COALESCE(ar.sell,0) - COALESCE(ar.strong_sell,0)*2)::NUMERIC / (COALESCE(ar.strong_buy,0)
        + COALESCE(ar.buy,0) + COALESCE(ar.hold,0) + COALESCE(ar.sell,0) + COALESCE(ar.strong_sell,0)),
        4) END AS analyst_consensus_score
      source_table: market.analyst_ratings
