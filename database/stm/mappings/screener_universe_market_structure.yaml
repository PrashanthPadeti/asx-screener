      transformation_rule: Aggregated inline by laterals with no GROUP BY, so each returns exactly one
        row per company -- including a zero count where there are no announcements.
      business_rule: Counts of announcement types over the trailing year, and the age of the most recent
        announcement.
      grain: one row per asx_code over a trailing one-year window
      unit: counts; days for days_since_last_announcement
      applicability: 'An aggregate with no GROUP BY returns 0, not NULL, for a company with no announcements
        -- so zero here means ''none found'', which conflates a quiet company with one whose announcements
        were never ingested. market.capital_raises carries finding 3: its writer uses ON CONFLICT DO NOTHING,
        so a correction to an already-ingested raise never lands.'
      derivation_formula: ann.capital_raise_count_1y
      source_table: market.asx_announcements
      source_column: market.asx_announcements.capital_raise_count_1y
      tables_involved: market.asx_announcements
      join_condition: 'LEFT JOIN LATERAL (market.asx_announcements) AS ann: aggregate, no GROUP BY ->
        exactly one row; WHERE released_at >= NOW() - INTERVAL ''1 year'' AND (document_type ILIKE ''%%Placement%%''
        OR document_type ILIKE ''%%Capital Raising%%'' OR document_type ILIKE ''%%Rights'
      writer_job: build_screener_universe.py (INSERT)
