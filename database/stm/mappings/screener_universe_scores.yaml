      source_table: screener.compute_runs
      transformation_rule: The run that produced this row, written by the canonical writer. The builder
        sets it NULL atomically with its own write, in the same statement as the values, so there is no
        window in which values and attribution disagree.
      business_rule: Attribution. It joins to screener.compute_runs for the factor model version and the
        source-health evidence behind any SOURCE_UNHEALTHY state, which is how a consumer tells 'this
        company pays no dividend' from 'we could not compute a dividend'.
      grain: one row per asx_code
      unit: n/a (foreign key to screener.compute_runs.id)
      applicability: NULL means the row is not attributed to a completed run. app/core/row_projection.py
        turns that into OUTSIDE_SNAPSHOT and nulls every governed value with a stated cause, so an un-attributed
        row fails closed at the API rather than being served as current. NULL on an old row may instead
        mean it predates run attribution -- never backfill it with a guess.
      writer_job: compute/engine/metric_states.py (UPDATE @152); compute/engine/universe_writer.py (canonical);
        build_screener_universe.py sets it NULL
      join_condition: FOREIGN KEY (compute_run_id) REFERENCES screener.compute_runs(id)
