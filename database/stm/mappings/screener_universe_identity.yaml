    market_cap_tier:
      transformation_rule: Six disjoint half-open bands over vs.market_cap in raw AUD -- mega >= 50e9,
        large [10e9, 50e9), mid [2e9, 10e9), small [300e6, 2e9), micro [50e6, 300e6), nano (0, 50e6).
