# External uptime sentinel.
#
# Runs on GitHub's infrastructure — outside the production host and outside the
# application stack it observes — so it keeps working exactly when the thing it
# watches does not. That is the whole point: on 2 Oct 2026 the site was
# unavailable for ~40 minutes and every mechanism that might have noticed was
# running on the host that was down.
#
# What this is, stated honestly:
#
#     external detection, a durable version-controlled record, AND an
#     outbound notification when a probe fails
#
# The "NOT operational paging" caveat that stood here was accurate and it cost
# three days. The sentinel detected production unavailable on 3, 4 and 5 Oct
# 2026 -- runs #5, #11 and #16, each failing the "Probe production" step, each
# in the window after the 06:35 UTC fund_prices trigger. Nobody was told. It
# was found when a human tried to log in on the third morning.
#
# Detection was never the problem. Delivery did not exist. It does now.
#
# NO LONGER SECRET-FREE, deliberately.
#
# This file used to say "secret-free by construction: a sentinel that needed
# credentials could not run here". That property was real and it is now
# traded away on purpose: RESEND_API_KEY, ALERT_EMAIL_TO and ALERT_EMAIL_FROM
# live in this repository's Actions secrets. A detector that cannot reach a
# human is not worth the property it was protecting. The probe itself still
# touches only public URLs; the credential is used solely to send the alert,
# and notify_outage.py never prints it.
#
# Containment of that secret:
#
#   - permissions: contents: read, and nothing else.
#   - triggers are `schedule` and `workflow_dispatch` ONLY. There is no
#     `pull_request` trigger, so code from a fork can never reach the step
#     that holds the credential.
#   - use a RESEND KEY SCOPED TO THIS MONITOR, not the application's
#     production key. A monitor is a low-trust context running on shared
#     infrastructure; it should not be able to send as the product.
#
# What a failing run records, and the one thing it cannot:
#
#     probe_failed=true
#     provider=resend
#     notification_accepted=true  message_id=...
#
# ACCEPTED is the provider taking the message. It is NOT arrival. Reception is
# established by a human seeing the mail and written into the acceptance
# evidence -- never inferred from a 2xx, which would be the same
# proxy-for-property substitution this sentinel exists to catch.
#
# Still outstanding, and not closed by this file:
#
#   CADENCE. The schedule below asks for 48 runs a day. Across 2-5 Oct 2026,
#   16 ran, with gaps of three to six hours. Why is not established here. The
#   measured property is enough: this scheduler does not deliver the intended
#   sampling rate, so an outage can begin and end unsampled. A dependable
#   external monitor remains necessary; this workflow is the durable record
#   and a best-effort alert, not a guaranteed one.

name: uptime sentinel

on:
  schedule:
    # Deliberately off the top of the hour. This is a secondary sentinel, not a
    # precision pager, and the top of the hour is when GitHub's scheduler is
    # most congested.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: >-
          Override the probed base URL. Exists so the NOTIFICATION path can be
          proven against a deliberately unreachable target -- the probe must
          fail, the alert must arrive, and the run must record that delivery
          succeeded. Leave empty to probe production.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Never stack runs: a late-scheduled run arriving during an outage should not
  # queue behind the previous one.
  group: uptime-sentinel
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Verify the probe's own logic before trusting its verdict
        # The evaluation logic is exercised with no network, so a failure here
        # means the sentinel is broken rather than the site.
        run: python3 .github/scripts/uptime_probe.py --self-test

      - name: Verify the notifier's own logic before trusting its silence
        # Same reasoning as the probe self-test. A notifier that cannot build a
        # valid request, or that degrades quietly when a secret is missing,
        # produces silence indistinguishable from "no outage".
        run: python3 .github/scripts/notify_outage.py --self-test

      - name: Probe production
        id: probe
        # Three independent observations per target, never short-circuiting on
        # success. Fails only when a target fails every observation; partial
        # failures are printed and kept as the record.
        env:
          # Scheduled runs are PINNED to production. The override is readable
          # only on workflow_dispatch, so a value cannot reach a scheduled run
          # by any path and the sentinel cannot be left quietly pointing
          # somewhere harmless.
          SENTINEL_BASE_URL: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || '' }}
        run: |
          python3 .github/scripts/uptime_probe.py
          echo "probe_failed=false" >> "$GITHUB_OUTPUT"

      - name: Tell a human
        # Fires on the PROBE failing, not on any failure in the job. If a
        # self-test fails the sentinel itself is broken, which is a different
        # thing from the site being down and must not send an outage alert.
        #
        # Fails itself when the provider does not accept the message, so "the
        # alert step ran" can never be mistaken for "someone was told".
        if: failure() && steps.probe.conclusion == 'failure' 
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: |
          echo "probe_failed=true"
          python3 .github/scripts/notify_outage.py             --subject "ASX Screener: production probe FAILED"             --body "The external uptime sentinel could not reach production.

          target   : ${{ inputs.base_url || 'https://asxscreener.com.au' }}
          run      : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          started  : ${{ github.event.repository.updated_at }}
          trigger  : ${{ github.event_name }}

          This is an external detection, not a diagnosis. The probe makes three
          observations per target and fails only when every one of them fails.

          On 3, 4 and 5 October 2026 this condition occurred and no alert was
          sent, because there was no notification path. There is one now.
