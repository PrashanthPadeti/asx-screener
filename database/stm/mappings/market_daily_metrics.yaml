    metric_states:
      source_column: "n/a"
      derivation_formula: "jsonb: metric -> {state, cause, reason, observed}"
      transformation_rule: "per-metric reason sidecar, LATEST ROW ONLY"
      business_rule: >
        SPARSE: an entry exists only for a metric whose state is not
        APPLICABLE, so a populated numeric column must never sit
        beside an entry, and a NULL numeric column with no entry is a
        contract violation rather than a default. NULL - not '{}' -
        means the row was never assessed; '{}' would claim it was
        examined and found clean. Written only on the row whose date
        matches the assessment, matched BY DATE rather than by
        position, because the warm-up filter and --since both reshape
        the frame and attaching a reason to the wrong day is worse
        than attaching none. This is the only Gold table that explains
        its own NULLs.
      unit: "jsonb"
      status: "written"

    compute_version:
      source_column: "COMPUTE_VERSION"
      transformation_rule: "module constant (\"1.0.0\")"
      business_rule: >
        Unchanged while the window semantics were replaced - row
        counts became day counts in v11.2.62 and calendar offsets
        later - so it does not separate rows computed under different
        rules.
      unit: "n/a"
      status: "written"

    computed_at:
      source_column: "datetime.now(timezone.utc)"
      transformation_rule: "run timestamp, identical across the run"
      business_rule: >
        LOAD TIME, distinct from `date` which is the trading day.
      unit: "timestamptz"
      status: "written"

