# financials.annual_cashflow  (Silver)
#
# Authored from backend/scripts/eodhd/v2/transforms/transform_financials.py
# :296-400, verified 6 November 2026.
#
# Units: AUD MILLIONS via _m() = round(v / 1_000_000, 2).
# Grain: one row per (asx_code, fiscal_year), UNIQUE-constrained.
# Source filter: staging_au.cash_flow WHERE period_type = 'yearly'.
# Dedup: latest period_end_date wins within a fiscal_year.
# Load: upsert on (asx_code, fiscal_year); TRUNCATE only on a --full run.
#
# 13 of the 29 columns receive a literal None from this transform. The EODHD
# cash-flow section carries seven figures; the schema has room for a full
# statement. Columns a different provider fills are marked as such, because
# "nothing writes this" and "this provider does not supply it" are different
# facts with different fixes.

table: financials.annual_cashflow
layer: Silver
source_layer: Bronze
grain: one row per (asx_code, fiscal_year)

defaults:
  source_system: EODHD
  source_table: staging_au.cash_flow
  source_filter: "period_type = 'yearly'"
  writer_job: scripts/eodhd/v2/transforms/transform_financials.py
  unit: AUD millions

columns:
  financials.annual_cashflow:

    id:
      source_column: generated
      transformation_rule: "nextval('annual_cashflow_id_seq')"
      business_rule: >
        Surrogate key, renumbered by a --full reload. The business key is
        (asx_code, fiscal_year).
      unit: n/a

    asx_code:
      source_column: asx_code
      transformation_rule: direct copy
      unit: n/a

    fiscal_year:
      source_column: date
      derivation_formula: "fiscal_year = EXTRACT(YEAR FROM period_end_date)"
      business_rule: Calendar year of the period end, not the Australian FY convention.
      unit: year

    period_end_date:
      source_column: date
      transformation_rule: direct copy
      unit: date

    net_income:
      source_column: not supplied by this transform
      transformation_rule: literal None
      business_rule: >
        NULL from the EODHD path, which passes None here
        (transform_financials.py:338) with the comment "not in CF staging" --
        staging_au.cash_flow genuinely has no net-income column. It IS written
        by load_fundamentals.py, which reads the fundamentals JSON directly.
        So whether a row has it depends on which writer last touched it, and
        nothing in the row says which that was except data_source.

    depreciation_amort:
      source_column: not supplied by this transform
      transformation_rule: literal None
      business_rule: >
        NULL from the EODHD transform; written by load_fundamentals.py. The
        same value also reaches annual_pnl.depreciation by a different route,
        and the two are not constrained to agree.

    working_capital_changes:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: ALWAYS NULL from this transform. Written only by load_fundamentals.py.

    other_operating:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: ALWAYS NULL from this transform.

    cfo:
      source_column: total_cash_from_operating_activities
      transformation_rule: "_m(): round(value / 1e6, 2)"
      business_rule: >
        Cash generated by operations. A governed input: source_fingerprint.py
        includes it in the yearly reuse fingerprint, so a change here
        legitimately refuses a daily publication. Negative for cash-burning
        companies, which is a real value and not an error.

    capex:
      source_column: capital_expenditures
      transformation_rule: "_m(): round(value / 1e6, 2)"
      business_rule: >
        SIGN: NEGATIVE as EODHD supplies it, an outflow. This is why fcf below
        is cfo PLUS capex rather than minus. Code that subtracts capex from
        cfo will double-count the spend and understate free cash flow by 2x.

    acquisitions:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: ALWAYS NULL from this transform.

    disposals:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: ALWAYS NULL from this transform.

    investment_purchases:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: ALWAYS NULL from this transform.

    other_investing:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: ALWAYS NULL from this transform.

    cfi:
      source_column: total_cash_from_investing_activities
      transformation_rule: "_m(): round(value / 1e6, 2)"
      business_rule: >
        A governed input in the yearly reuse fingerprint. Usually negative.

    dividends_paid:
      source_column: dividends_paid
      transformation_rule: "_m(): round(value / 1e6, 2)"
      business_rule: >
        SIGN follows EODHD, which reports it as a negative outflow. A governed
        input in the yearly reuse fingerprint. This is cash actually paid in
        the period, which lags the declared dividend and will not reconcile
        to market.dividends summed over ex-dates.

    debt_raised:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: ALWAYS NULL from this transform.

    debt_repaid:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: >
        NULL from this transform; written by load_fmp_financials.py, a
        different provider path.

    equity_raised:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: >
        A GOVERNED INPUT WITH NO EODHD WRITER. source_fingerprint.py includes
        equity_raised in the yearly reuse fingerprint and yearly_compute reads
        it (yearly_compute.py:487), yet the EODHD transform passes None
        (transform_financials.py:352). The only module that sets it is
        scripts/load_fmp_financials.py, a Financial Modeling Prep path that is
        not part of the daily or weekly pipeline. So for any row this
        transform wrote, the value a dilution or funding measure consumes is
        NULL, and the fingerprint is hashing a column that never changes.
        Worth confirming whether the FMP loader still runs at all.

    buybacks:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: >
        NULL from this transform; written by load_fmp_financials.py only.

    other_financing:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: ALWAYS NULL from this transform.

    cff:
      source_column: total_cash_from_financing_activities
      transformation_rule: "_m(): round(value / 1e6, 2)"

    net_change_in_cash:
      source_column: change_to_cash
      transformation_rule: "_m(): round(value / 1e6, 2)"
      business_rule: >
        Should equal cfo + cfi + cff, but is taken as reported rather than
        recomputed. FX translation on foreign cash balances makes the identity
        fail legitimately for companies with overseas operations.

    opening_cash:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: ALWAYS NULL from this transform.

    closing_cash:
      source_column: not supplied
      transformation_rule: literal None
      business_rule: >
        ALWAYS NULL from this transform. The balance-sheet cash figure lives
        in annual_balance_sheet.cash_equivalents and is the one to use.

    fcf:
      source_column: free_cash_flow, else derived
      tables_involved: staging_au.cash_flow
      derivation_formula: "fcf = _m(free_cash_flow) if reported else round(cfo_m + capex_m, 2)"
      transformation_rule: >
        Prefers the reported figure. Falls back to cfo + capex -- PLUS, because
        capex is already negative.
      business_rule: >
        Two different provenances in one column, and the row does not say
        which. Where EODHD reports free_cash_flow it is used as given, so a
        provider's own definition (which may deduct more than capex) applies.
        Where it does not, the fallback is the strict cfo + capex definition.
        A series can therefore switch definition mid-way with no marker. NULL
        only when the reported figure is absent AND either input is NULL.
        A governed input in the yearly reuse fingerprint.

    is_restated:
      source_column: not supplied
      transformation_rule: column default false
      business_rule: >
        ALWAYS false. No writer sets it. A confident negative where the truth
        is unknown: restatements do occur and the upsert absorbs them silently.
      unit: n/a

    data_source:
      source_column: literal
      derivation_formula: "data_source = 'eodhd'"
      business_rule: >
        The only way to tell which of the four writers produced a row, and
        therefore which of the NULL columns above are "this provider does not
        supply it" rather than "nobody does".
      unit: n/a

    data_as_of:
      source_column: NOW()
      transformation_rule: set to NOW() on UPDATE only
      business_rule: >
        Not a lineage marker; moves on every upsert regardless of whether a
        value changed, and other writers leave it untouched.
      unit: timestamptz
