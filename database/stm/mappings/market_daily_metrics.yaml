      status: "written"

    return_1d:
      source_column: "close"
      derivation_formula: "close / close of the preceding row - 1, overflow-guarded"
      transformation_rule: "single-row return"
      business_rule: >
        NOT a window: it compares a close with its predecessor ROW, so
        across a trading halt or a data gap it spans more than a day.
        Named explicitly in RETURN_COLS for that reason.
      unit: "ratio"
      status: "written"

    return_ytd:
      source_column: "close"
      derivation_formula: "close / last close of the previous calendar year - 1, overflow-guarded"
      transformation_rule: "year-to-date return"
      business_rule: >
        Anchored on the CALENDAR year, not the fiscal year, so for an
        ASX issuer with a June year end this spans part of two
        reporting periods.
      unit: "ratio"
      status: "written"

    return_1w:
      source_column: "close"
      derivation_formula: "close / anchor close - 1, where anchor = last close <= date - 7 days (grace 4d)"
      transformation_rule: "calendar 7 days return, grace 4 days"
      business_rule: >
        Anchor is the LAST close at or before (date - 7 days), within
        4 days. Taking the last rather than the nearest matters: the
        nearest could sit AFTER the target and shorten the window, and
        a return that silently measures less than it claims is no
        better than one that measures more. WITHHELD where the window
        spans a corporate action that cannot be adjusted out; the
        reason is in metric_states on the latest row. Grace: the
        exchange calendar - Good Friday to Easter Monday.
      unit: "ratio"
      status: "written"

