name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          cd backend
          # PINNED. Unpinned, a release on PyPI changes which rules apply and
          # turns `main` red with no change to this repository -- which is
          # exactly what happened around 21 Oct 2026. Bump this deliberately,
          # and read the new findings when you do.
          pip install ruff==0.17.2 mypy
      - name: Ruff lint
        # Rules are declared in backend/ruff.toml, not inherited from whatever
        # the newest ruff defaults to. compute/ is included because the
        # governed-metrics engine lives there and had never been linted at all.
        #
        # This list is the lint POPULATION, and until 11 Nov 2026 it was two
        # of the four directories that hold Python here. A NameError shipped
        # in scripts/ and blocked the universe build in production; F821 was
        # selected and pinned the whole time and named all three call sites
        # the moment it was pointed at the file. A verdict scoped to part of
        # a tree says nothing about the rest, and said nothing about that.
        #
        # Everything under backend/ is now covered. Keep it that way:
        # tests/test_lint_population_covers_the_backend.py fails if a
        # directory of Python falls out of this command, and suspending a
        # rule belongs in ruff.toml's per-file-ignores, where it is visible
        # and counted, rather than here where it looks like a path list.
        run: cd backend && ruff check app/ compute/ scripts/ tests/ worker.py
      - name: Type check
        run: cd backend && mypy app/ --ignore-missing-imports || true

  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --tb=short || echo "No tests yet"
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          DATABASE_URL_SYNC: "postgresql://test:test@localhost/test"
          JWT_SECRET: "test-secret-key"
