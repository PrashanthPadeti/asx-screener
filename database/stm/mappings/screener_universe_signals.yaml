    gross_margin_expansion:
      transformation_rule: Boolean comparisons computed inline, each under a CASE that yields NULL when
        either side is missing.
      business_rule: 'Directional claims about profit quality -- margins expanding, earnings beating revenue
        growth. Period: the latest fiscal year the company has reported (`pnl0`, chosen by ORDER BY fiscal_year
        DESC LIMIT 1), NOT a fixed calendar year. Two companies in the same row of a screen may be reporting
        periods up to eleven months apart, and the period itself is not published on the row.'
      grain: one row per asx_code at the latest fiscal year
      unit: booleans, and decimal ratios for the magnitudes
      applicability: 'A NULL here is unknown, not false, and the CASE structure preserves that -- unlike
        market.weekly_metrics (finding 10), where the same situation is written FALSE. Governed column:
        the builder''s value is PROVISIONAL. `compute/engine/universe_writer.py` overwrites it last, driven
        by the governed registry, and assigns every governed column on every canonical row including an
        explicit NULL -- so ''no value this run'' replaces the previous run''s number instead of leaving
        it in place. Precedence is therefore: builder INSERT, then engine updaters, then the canonical
        writer. Until the canonical writer commits, `metric_states` and `compute_run_id` are NULL and
        `app/core/row_projection.py` fails the row closed as OUTSIDE_SNAPSHOT rather than serving it.
        Source carries finding 6: of 188 columns on `market.yearly_metrics`, 27 are never written and
        37 hold frozen values produced by the superseded `_avg` helper -- proven by window-length inversions,
        where avg_roe_10y exceeds avg_roe_7y on the same company. Check a column against that census before
        relying on it.'
      derivation_formula: CASE WHEN ym.avg_gross_margin_3y BETWEEN -100 AND 100 AND ym.avg_gross_margin_5y
