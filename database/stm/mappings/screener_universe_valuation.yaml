      unit: AUD per share for the per-share columns; AUD MILLIONS for working_capital, per its column
        comment
      applicability: 'NULL when the share count is absent or not positive. price_to_52w_high belongs to
        this migration batch (052) and is FINDING 11: it is in neither the INSERT nor the ON CONFLICT
        SET list, so an existing row''s value is never touched by any run. Measured 10 Nov 2026: frozen
        on 2,290 of 2,566 rows and served through a registered filter, a sort column and a response field.
        The other five columns of that batch are wired correctly.'
      derivation_formula: CASE WHEN dp52.low_52w > 0 THEN ROUND((dp.close / dp52.low_52w)::numeric, 4)
        END AS price_to_52w_low
