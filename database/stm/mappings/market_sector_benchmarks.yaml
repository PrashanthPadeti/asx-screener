      status: "written"

    updated_at:
      source_column: "NOW()"
      transformation_rule: "run timestamp"
      business_rule: >
        LOAD TIME. The only currency signal on the row, since
        compute_run_id is never written.
      unit: "timestamptz"
      status: "written"

    benchmark_states:
      source_column: "n/a"
      derivation_formula: "jsonb: metric -> {state, reason_code, n_total_peers, n_applicable_peers, n_valid_peers, coverage_pct}"
      transformation_rule: "per-metric state and denominators"
      business_rule: >
        Carries counts for APPLICABLE benchmarks too, not only
        withheld ones, so the denominator behind a published median is
        always visible. Covers the GOVERNED metrics only - the three
        ungoverned medians have no entry.
      unit: "jsonb"
      status: "written"

    compute_run_id:
      source_column: "n/a"
      derivation_formula: "not written by any module"
      transformation_rule: "NOT WRITTEN - declared contract, no producer"
      business_rule: >
        DECLARED AND NEVER ENFORCED. The column has a foreign key to
        screener.compute_runs and a schema comment requiring it to
        match the compute_run_id of the universe rows it
        contextualises, so that a factor score and the peer statistic
        beside it come from the same assessment set.
        sector_benchmarks.py never mentions the column, and no other
        module writes this table. The pairing the comment demands
        cannot be demonstrated for any row.
      unit: "n/a"
      status: "NOT WRITTEN - declared but no producer"
