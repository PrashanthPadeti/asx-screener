        short series is not reported as a bearish signal.
      unit: "boolean"
      status: "written"

    golden_cross:
      source_column: "close"
      derivation_formula: "sma_50 > sma_200 AND sma_50_prev <= sma_200_prev"
      transformation_rule: "boolean, 50 crossing above 200 on this row"
      business_rule: >
        An EVENT on one row, not a state. It is true only on the day
        of the crossing, so a screen looking for 'currently in a
        golden cross' needs above_sma200 and the two averages, not
        this flag.
      unit: "boolean"
      status: "written"

    death_cross:
      source_column: "close"
      derivation_formula: "sma_50 < sma_200 AND sma_50_prev >= sma_200_prev"
      transformation_rule: "boolean, 50 crossing below 200 on this row"
      business_rule: >
        An event on one row - see golden_cross.
      unit: "boolean"
      status: "written"

    new_52w_high:
      source_column: "close, high, low"
      derivation_formula: "this row sets a new high_52w"
      transformation_rule: "boolean, high_52w made on this row"
