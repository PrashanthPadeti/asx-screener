# Source-to-target mapping — authored half
# =========================================
# financials.annual_pnl  (Silver)
#
# The generator supplies everything structural from the schema snapshot and
# the lineage graph: data type, precision, nullability, key membership, CHECK
# values, writer job, load strategy, join conditions. None of that belongs
# here, and anything written here OVERRIDES the generated value -- so only
# override when the generated value is wrong, and say why.
#
# What belongs here is what no column definition can tell you: which source
# field it came from, what was done to it, and what a reader would otherwise
# assume incorrectly.
#
# Authored from the code that runs, not from the column names:
#   backend/scripts/eodhd/v2/transforms/transform_financials.py:62-156
# Verified against that file on 6 November 2026.

table: financials.annual_pnl
layer: Silver
source_layer: Bronze
grain: one row per (asx_code, fiscal_year)

# ── Facts that apply to every column in this table ───────────────────────────
defaults:
  source_system: EODHD
  source_table: staging_au.income_statement
  source_filter: "period_type = 'yearly'"
  writer_job: scripts/eodhd/v2/transforms/transform_financials.py

# UNITS — the single most misreadable thing about this table.
#
# Every monetary column passes through _m(), which is
#     round(float(v) / 1_000_000, 2)
# so the income statement is expressed in AUD MILLIONS to 2 decimal places.
#
# eps and eps_diluted pass through _f(), which does NOT divide. They are in
# AUD PER SHARE. Reading revenue and eps as the same unit is wrong by a factor
# of a million, and nothing in the column types distinguishes them -- both are
# NUMERIC. This is why the unit field exists.

# DEDUPLICATION — EODHD can return more than one yearly row whose period end
# date falls in the same calendar year (a year-end change, a restatement filed
# under a new date). The transform keeps the row with the LATEST
# period_end_date per (asx_code, fiscal_year) before loading. Earlier rows are
# discarded and are not recoverable from this table; they remain in
# staging_au.income_statement until the next truncating reload.

# LOAD — ON CONFLICT (asx_code, fiscal_year) DO UPDATE, i.e. an upsert, on
# every incremental run. TRUNCATE ... RESTART IDENTITY CASCADE happens only on
# a full run (--full), at transform_financials.py:425-430. The generator's
# load_strategy reports both operations because both exist in the module; the
# incremental path is the one that runs daily.

columns:
  financials.annual_pnl:

    asx_code:
      source_column: asx_code
      transformation_rule: direct copy, no normalisation
      business_rule: >
        ASX ticker without the .AU exchange suffix. The suffix is stripped
        upstream, at the staging load, not here.
      grain: part of the business key
      unit: n/a

    fiscal_year:
      source_column: date
      derivation_formula: "fiscal_year = EXTRACT(YEAR FROM period_end_date)"
      transformation_rule: calendar year of the period end date
      business_rule: >
        NOT the Australian fiscal-year convention. A company with a 30 June
        2025 year end is fiscal_year 2025, which matches FY25 by coincidence;
        a company with a 31 December 2025 year end is ALSO fiscal_year 2025,
        and that is CY2025, not FY26. Two companies in the same fiscal_year
        can therefore be reporting periods six months apart. Any comparison
        across companies within a fiscal_year carries that risk, and
        period_end_date is the column that resolves it.
      grain: part of the business key
      unit: year

    period_end_date:
      source_column: date
      transformation_rule: direct copy
      business_rule: >
        The authoritative period boundary. Where fiscal_year is ambiguous
        across companies, this is not. Downstream price-window calculations
        bound themselves by this date rather than by fiscal_year.
      unit: date

    revenue:
      source_column: total_revenue
      transformation_rule: "_m(): round(value / 1000000, 2)"
      derivation_formula: "revenue = total_revenue / 1e6"
      business_rule: >
        Total revenue as reported. Not adjusted, not normalised for
        discontinued operations. NULL where EODHD omits the field, which is
        distinct from a reported zero -- see v11.2.74: a loader that mapped
        0 to NULL erased every disclosed zero, and totalAssets was genuinely
        zero 19 times in 33,201 company-years.
      unit: AUD millions

    cost_of_sales:
      source_column: cost_of_revenue
      transformation_rule: "_m(): round(value / 1000000, 2)"
      business_rule: renamed from the EODHD field name; no other change.
      unit: AUD millions

    gross_profit:
      source_column: gross_profit
      transformation_rule: "_m(): round(value / 1000000, 2)"
      business_rule: >
        Taken as reported rather than recomputed as revenue - cost_of_sales.
        The two can disagree when a filer classifies an item outside cost of
        revenue, and the reported figure is the one the market quotes.
      unit: AUD millions

    operating_expenses:
      source_column: total_operating_expenses
      transformation_rule: "_m(): round(value / 1000000, 2)"
      unit: AUD millions

    ebit:
      source_column: operating_income
      transformation_rule: "_m(): round(value / 1000000, 2)"
      business_rule: >
        EODHD's operating_income is stored as ebit. They are treated as
        synonymous here. For filers who report significant non-operating
        items inside operating income, that equivalence is approximate.
      unit: AUD millions

    ebitda:
      source_column: ebitda
      transformation_rule: "_m(): round(value / 1000000, 2)"
      business_rule: >
        As reported by EODHD, NOT derived as ebit + depreciation. Where EODHD
        omits it the column is NULL even though ebit and depreciation are
        both present.
      unit: AUD millions

    depreciation:
      source_column: depreciation_amortization
      transformation_rule: "_m(): round(value / 1000000, 2)"
      business_rule: depreciation and amortisation combined, as the source supplies them.
      unit: AUD millions

    interest_expense:
      source_column: interest_expense
      transformation_rule: "_m(): round(value / 1000000, 2)"
      business_rule: >
        Sign convention follows EODHD, which reports it as a positive
        magnitude. Consumers computing interest cover must not negate it.
      unit: AUD millions

    pbt:
      source_column: income_before_tax
      transformation_rule: "_m(): round(value / 1000000, 2)"
      unit: AUD millions

    tax:
      source_column: income_tax_expense
      transformation_rule: "_m(): round(value / 1000000, 2)"
      business_rule: >
        Expense as a positive number. A tax benefit appears negative.
      unit: AUD millions

    pat:
      source_column: net_income
      transformation_rule: "_m(): round(value / 1000000, 2)"
      unit: AUD millions

    net_profit:
      source_column: net_income
      transformation_rule: "_m(): round(value / 1000000, 2)"
      business_rule: >
        DUPLICATE OF pat. Both columns are loaded from the same EODHD field,
        with the source comment "net_profit same as net_income from EODHD"
        (transform_financials.py:108). They cannot disagree today. Two
        columns holding one fact is a latent defect: any future writer that
        sets one and not the other creates a disagreement no constraint
        prevents, and downstream code picks whichever it happened to use.
        Flagged rather than silently documented as two measures.
      unit: AUD millions

    opm:
      source_column: derived
      tables_involved: staging_au.income_statement
      derivation_formula: "opm = round(operating_income / total_revenue, 6)"
      transformation_rule: >
        Computed in the transform, from the UNCONVERTED staging values, so
        the million-scaling cancels and the ratio is unaffected.
      business_rule: >
        NULL when revenue is NULL or zero -- the guard is `if rev and ...`,
        which also treats 0.0 as absent. Correct here: a margin on zero
        revenue is undefined, not zero. Expressed as a RATIO (0.0834), not a
        percentage, and the API multiplies by 100 at the presentation edge.
      unit: ratio (0-1), 6 dp

    npm:
      source_column: derived
      derivation_formula: "npm = round(net_income / total_revenue, 6)"
      business_rule: >
        Same zero-revenue guard as opm. Can legitimately be negative.
      unit: ratio (0-1), 6 dp

    gpm:
      source_column: derived
      derivation_formula: "gpm = round(gross_profit / total_revenue, 6)"
      business_rule: >
        Same zero-revenue guard as opm. NULL for filers who report no gross
        profit line -- banks and most REITs, where cost of revenue is not a
        meaningful concept.
      unit: ratio (0-1), 6 dp

    ebitda_margin:
      source_column: derived
      derivation_formula: "ebitda_margin = round(ebitda / total_revenue, 6)"
      business_rule: >
        Same zero-revenue guard as opm. NULL wherever EODHD omits ebitda,
        which is more often than it omits ebit.
      unit: ratio (0-1), 6 dp

    eps:
      source_column: eps
      transformation_rule: "_f(): float(value) — NO million conversion"
      business_rule: >
        AUD PER SHARE, unlike every monetary column in this table. The
        distinction is invisible in the column type: both are NUMERIC. Basic
        EPS as reported; not restated for later share-count changes, so a
        historical row reflects the share count at the time of reporting.
      unit: AUD per share

    eps_diluted:
      source_column: eps_diluted
      transformation_rule: "_f(): float(value) — NO million conversion"
      business_rule: >
        AUD per share. Equals eps for companies with no dilutive instruments;
        NULL where the source does not report a diluted figure, which is not
        the same as "no dilution".
      unit: AUD per share

    data_source:
      source_column: literal
      derivation_formula: "data_source = 'eodhd'"
      transformation_rule: constant, set by the transform
      business_rule: >
        Provenance marker. Constant today because EODHD is the only writer of
        this table through this path; the column exists so a second source
        can be distinguished rather than merged silently.
      unit: n/a

    # ── Columns transform_financials does not write ────────────────────────
    # annual_pnl has FIVE writers: transform_financials.py (the daily path,
    # mapped above), load_fundamentals.py, load_dividends.py,
    # load_eodhd_financials.py and load_fmp_financials.py. Ten of the columns
    # below are named by NONE of them and hold their default forever.

    id:
      source_column: generated
      transformation_rule: "nextval('annual_pnl_id_seq')"
      business_rule: >
        Surrogate key, renumbered by a --full reload. The business key is
        (asx_code, fiscal_year), which carries the UNIQUE constraint.
      unit: n/a

    report_date:
      source_column: not supplied
      transformation_rule: never written
      business_rule: >
        ALWAYS NULL. Named by none of the five writers. The date a result was
        REPORTED -- as distinct from period_end_date, the period it covers --
        is therefore unavailable, so point-in-time correctness cannot be
        established from this table: there is no way to know when a figure
        became public. financials.half_year_pnl has a column of the same name,
        which is why a repo-wide search for it misleadingly finds hits.
      unit: date

    other_income:
      source_column: not supplied by the EODHD transform
      transformation_rule: literal None from transform_financials
      business_rule: >
        NULL on rows this transform wrote. Written only by the
        load_fundamentals / FMP paths, so whether a row carries it depends on
        which writer last touched it, and only data_source says which.

    amortisation:
      source_column: not supplied
      transformation_rule: never written
      business_rule: >
        ALWAYS NULL. Amortisation is not absent from the data -- it is folded
        into `depreciation`, which receives EODHD's combined
        depreciation_amortization. Reading this column as "amortisation is
        zero or unknown" while depreciation silently contains both is the
        trap.

    interest_income:
      source_column: not supplied
      transformation_rule: never written
      business_rule: >
        ALWAYS NULL. interest_expense is populated, so any net-interest
        calculation has only one side and will overstate the net cost.

    minority_interest:
      source_column: not supplied
      transformation_rule: never written
      business_rule: >
        ALWAYS NULL. For companies with material non-controlling interests,
        net_profit and pat cannot be reconciled to the parent's share from
        this table.

    extraordinary_items:
      source_column: not supplied by the EODHD transform
      transformation_rule: literal None from transform_financials
      business_rule: NULL on rows this transform wrote; set only by other provider paths.

    dividend_paid:
      source_column: not supplied
      transformation_rule: never written
      business_rule: >
        ALWAYS NULL. The cash dividend figure lives in
        financials.annual_cashflow.dividends_paid; this column duplicates the
        concept and holds nothing.

    material_cost:
      source_column: not supplied
      transformation_rule: never written
      business_rule: >
        ALWAYS NULL. A cost-breakdown line inherited from a schema modelled
        on a different market's disclosure regime; EODHD does not supply it.

    employee_cost:
      source_column: not supplied
      transformation_rule: never written
      business_rule: ALWAYS NULL. Same inheritance as material_cost.

    shares_used:
      source_column: supplied by the fundamentals path
      transformation_rule: not written by transform_financials
      business_rule: >
        The share count the reported EPS was struck on. NULL on rows this
        transform wrote. Where it is present it is the honest denominator for
        reconciling eps against net_profit; where it is NULL, any such
        reconciliation has to substitute a share count from another period,
        which is what makes historical per-share figures revise.
      unit: shares

    dps:
      source_column: derived from market.dividends
      source_table: market.dividends
      writer_job: scripts/eodhd/load_dividends.py
      transformation_rule: dividends aggregated to the fiscal year
      business_rule: >
        Written by the DIVIDENDS loader, not by the financials transform --
        which is why load_dividends.py appears as a writer of a P&L table and
        looks wrong in the lineage graph until you see this. Aggregated from
        market.dividends over the fiscal year, so it inherits that table's
        ex-date basis rather than the cash-paid basis in the cash-flow
        statement; the two will not agree.
      unit: AUD per share

    dps_franking_pct:
      source_column: not supplied
      transformation_rule: never written; column default 0
      business_rule: >
        ALWAYS 0, AND THAT IS A CONFIDENT NEGATIVE. The default asserts every
        dividend in this table is unfranked, which is wrong for most of the
        ASX. Franking is real and lives in market.dividends.franking_pct;
        this column is the empty duplicate. A grossed-up yield computed from
        here would be identical to the plain yield for every company.
      valid_values: "0 to 100 (percent)"
      unit: percent

    dps_grossed_up:
      source_column: not supplied
      transformation_rule: never written
      business_rule: >
        ALWAYS NULL. The grossed-up dividend -- the product's distinguishing
        measure -- is computed downstream and never persisted here.
      unit: AUD per share

    currency:
      source_column: not supplied by the EODHD transform
      transformation_rule: never written; column default 'AUD'
      business_rule: >
        ALWAYS 'AUD', ASSERTED NOT OBSERVED. No writer sets it. USD-reporting
        ASX companies exist -- BHP among them -- and their statements are
        stated in USD while this column claims AUD. The honest value is in
        staging_au.fundamentals.reporting_currency, which deliberately keeps
        NULL distinct from AUD precisely because General.CurrencyCode reads
        AUD for USD reporters. That care is lost here.
      unit: ISO currency code

    is_restated:
      source_column: not supplied
      transformation_rule: never written; column default false
      business_rule: >
        ALWAYS false. A confident negative: restatements occur and the upsert
        absorbs them silently, overwriting the prior figures with no marker.
      unit: n/a

    data_as_of:
      source_column: NOW()
      transformation_rule: "set to NOW() on UPDATE only, not on INSERT"
      business_rule: >
        NOT a lineage marker, and must not be used as one. It moves on every
        upsert whether or not a single value changed, and three of the four
        writers that touch financials.annual_* leave it untouched entirely.
        So an unchanged source reads as changed AND a real change can read as
        unchanged. source_fingerprint.py rejected this column for exactly
        that reason and fingerprints content instead.
      unit: timestamptz
