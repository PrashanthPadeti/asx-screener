    return_1y_median:
      source_column: "return_1y"
      derivation_formula: "_med(grp[\"return_1y\"]) - a plain median"
      transformation_rule: "UNGOVERNED median"
      business_rule: >
        UNGOVERNED: labelled so in the source. No entry appears in
        benchmark_states for it, so a NULL here says nothing at all -
        neither that it was withheld nor why.
      unit: "ratio"
      status: "written"

    return_ytd_median:
      source_column: "return_ytd"
