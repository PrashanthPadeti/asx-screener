      unit: 'jsonb: metric -> {state, cause, reason}'
      applicability: NULL means the row was never assessed, which is NOT the same as assessed-and-clean
        ('{}') and must fail closed. A NULL numeric column with no entry here is a contract violation.
        There is deliberately NO column default, so an ad-hoc INSERT cannot produce a valid-looking row
        by construction.
