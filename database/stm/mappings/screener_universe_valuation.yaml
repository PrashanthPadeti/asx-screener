      transformation_rule: 'Computed inline, each guarded by a CASE on its denominator. The per-share
        columns convert an AUD-millions statement figure to AUD per share: value * 1e6 / shares_outstanding.'
      business_rule: 'Per-share figures use the CURRENT share count against a fiscal-year flow. A capital
        raising between the balance date and today therefore dilutes a historical flow by a count that
        did not exist during it. Period: the latest fiscal year the company has reported (`pnl0`, chosen
        by ORDER BY fiscal_year DESC LIMIT 1), NOT a fixed calendar year. Two companies in the same row
        of a screen may be reporting periods up to eleven months apart, and the period itself is not published
        on the row.'
