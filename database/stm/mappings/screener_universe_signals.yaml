        -> exactly one row; WHERE rn <= 4), 4) AS eps_beat_rate_4q, ROUND(AVG(CASE WHEN beat_miss = ''beat''
        THEN 1.0 ELSE 0.0 END) FILTER (WHERE rn <= 8), 4) AS eps_beat_rate_8q, COUNT(*) FILTER'
      writer_job: build_screener_universe.py (INSERT)
