        surprise history, listing age, reporting currency.
      grain: one row per asx_code
      unit: mixed; stated per column by the column comment where set
      applicability: reporting_currency is the input to applicability gate 1b and therefore decides whether
        eight valuation ratios are NOT_MEANINGFUL. Its lateral takes LIMIT 1 with no ORDER BY, which is
        deterministic ONLY because staging_au.fundamentals carries UNIQUE (asx_code) -- that constraint
