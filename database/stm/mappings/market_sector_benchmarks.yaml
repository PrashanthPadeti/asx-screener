        UNGOVERNED: labelled so in the source. No entry appears in
        benchmark_states for it, so a NULL here says nothing at all -
        neither that it was withheld nor why. market_cap inherits the
        universe's raw-AUD basis - see OPEN_FINDINGS.md s.4.
